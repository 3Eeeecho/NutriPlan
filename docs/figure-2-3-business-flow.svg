<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333" />
    </marker>
    <style>
      .title { font: 700 28px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #222; }
      .label { font: 700 30px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #222; }
      .box-text { font: 700 24px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #222; }
      .small-text { font: 600 20px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #333; }
      .frame { fill: #ffffff; stroke: #333333; stroke-width: 3; }
      .box { fill: #f8f8f8; stroke: #333333; stroke-width: 2.5; rx: 8; ry: 8; }
      .subbox { fill: #ffffff; stroke: #555555; stroke-width: 2; rx: 6; ry: 6; }
      .arrow { stroke: #333333; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #555555; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1398" height="978" fill="#ffffff"/>

  <text x="90" y="85" class="label">主业务流程</text>
  <rect x="160" y="40" width="680" height="880" class="frame"/>

  <rect x="350" y="90" width="300" height="80" class="box"/>
  <text x="500" y="138" text-anchor="middle" class="box-text">用户注册 / 登录</text>

  <rect x="320" y="220" width="360" height="80" class="box"/>
  <text x="500" y="268" text-anchor="middle" class="box-text">健康档案录入与维护</text>

  <rect x="340" y="350" width="320" height="80" class="box"/>
  <text x="500" y="398" text-anchor="middle" class="box-text">营养需求计算</text>

  <rect x="300" y="480" width="400" height="80" class="box"/>
  <text x="500" y="528" text-anchor="middle" class="box-text">个性化饮食方案生成</text>

  <rect x="320" y="610" width="360" height="80" class="box"/>
  <text x="500" y="658" text-anchor="middle" class="box-text">用户选择推荐方案</text>

  <rect x="320" y="740" width="360" height="100" class="box"/>
  <text x="500" y="788" text-anchor="middle" class="box-text">实际饮食记录</text>

  <rect x="220" y="860" width="140" height="48" class="subbox"/>
  <text x="290" y="891" text-anchor="middle" class="small-text">手动记录</text>

  <rect x="430" y="860" width="140" height="48" class="subbox"/>
  <text x="500" y="891" text-anchor="middle" class="small-text">文本分析</text>

  <rect x="640" y="860" width="140" height="48" class="subbox"/>
  <text x="710" y="891" text-anchor="middle" class="small-text">图像识别</text>

  <line x1="500" y1="170" x2="500" y2="220" class="arrow"/>
  <line x1="500" y1="300" x2="500" y2="350" class="arrow"/>
  <line x1="500" y1="430" x2="500" y2="480" class="arrow"/>
  <line x1="500" y1="560" x2="500" y2="610" class="arrow"/>
  <line x1="500" y1="690" x2="500" y2="740" class="arrow"/>
  <line x1="500" y1="840" x2="500" y2="920" class="arrow"/>

  <line x1="500" y1="920" x2="290" y2="920" class="arrow"/>
  <line x1="290" y1="920" x2="290" y2="908" class="arrow"/>

  <line x1="500" y1="920" x2="500" y2="908" class="arrow"/>

  <line x1="500" y1="920" x2="710" y2="920" class="arrow"/>
  <line x1="710" y1="920" x2="710" y2="908" class="arrow"/>

  <text x="930" y="85" class="label">反馈与辅助流程</text>
  <rect x="900" y="40" width="410" height="880" class="frame"/>

  <rect x="980" y="160" width="250" height="80" class="box"/>
  <text x="1105" y="208" text-anchor="middle" class="box-text">统计分析与反馈</text>

  <rect x="980" y="330" width="250" height="80" class="box"/>
  <text x="1105" y="378" text-anchor="middle" class="box-text">菜谱收藏</text>

  <rect x="980" y="500" width="250" height="80" class="box"/>
  <text x="1105" y="548" text-anchor="middle" class="box-text">购物清单生成</text>

  <rect x="980" y="670" width="250" height="80" class="box"/>
  <text x="1105" y="718" text-anchor="middle" class="box-text">方案调整</text>

  <line x1="680" y1="650" x2="980" y2="650" class="arrow"/>
  <line x1="980" y1="650" x2="980" y2="710" class="arrow"/>

  <line x1="700" y1="520" x2="980" y2="520" class="arrow"/>
  <line x1="700" y1="520" x2="980" y2="370" class="arrow"/>

  <line x1="680" y1="790" x2="980" y2="790" class="arrow"/>
  <line x1="980" y1="790" x2="980" y2="200" class="arrow"/>

  <line x1="980" y1="200" x2="700" y2="200" class="dashed"/>
  <line x1="700" y1="200" x2="700" y2="520" class="dashed"/>
</svg>
