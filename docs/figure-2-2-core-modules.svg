<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333" />
    </marker>
    <style>
      .title { font: 700 28px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #222; }
      .layer-label { font: 700 30px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #222; }
      .box-text { font: 700 26px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #222; }
      .small-text { font: 600 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #222; }
      .frame { fill: #ffffff; stroke: #333333; stroke-width: 3; }
      .box { fill: #f8f8f8; stroke: #333333; stroke-width: 2.5; rx: 8; ry: 8; }
      .arrow { stroke: #333333; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .assist-arrow { stroke: #555555; stroke-width: 2.2; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="1" y="1" width="1398" height="878" fill="#ffffff"/>
  <text x="70" y="195" class="layer-label">核心业务链</text>
  <rect x="170" y="90" width="1170" height="230" class="frame"/>

  <rect x="225" y="165" width="150" height="90" class="box"/>
  <text x="300" y="220" text-anchor="middle" class="box-text">用户管理</text>

  <rect x="430" y="165" width="190" height="90" class="box"/>
  <text x="525" y="220" text-anchor="middle" class="box-text">健康档案管理</text>

  <rect x="675" y="165" width="170" height="90" class="box"/>
  <text x="760" y="220" text-anchor="middle" class="box-text">饮食推荐</text>

  <rect x="900" y="165" width="170" height="90" class="box"/>
  <text x="985" y="220" text-anchor="middle" class="box-text">饮食记录</text>

  <rect x="1125" y="165" width="160" height="90" class="box"/>
  <text x="1205" y="220" text-anchor="middle" class="box-text">统计分析</text>

  <line x1="375" y1="210" x2="430" y2="210" class="arrow"/>
  <line x1="620" y1="210" x2="675" y2="210" class="arrow"/>
  <line x1="845" y1="210" x2="900" y2="210" class="arrow"/>
  <line x1="1070" y1="210" x2="1125" y2="210" class="arrow"/>

  <text x="70" y="560" class="layer-label">辅助服务</text>
  <rect x="170" y="390" width="1170" height="280" class="frame"/>

  <rect x="255" y="470" width="220" height="100" class="box"/>
  <text x="365" y="530" text-anchor="middle" class="box-text">菜谱收藏</text>

  <rect x="590" y="470" width="220" height="100" class="box"/>
  <text x="700" y="530" text-anchor="middle" class="box-text">购物清单</text>

  <rect x="925" y="470" width="220" height="100" class="box"/>
  <text x="1035" y="530" text-anchor="middle" class="box-text">方案调整</text>

  <line x1="760" y1="255" x2="760" y2="430" class="arrow"/>

  <line x1="365" y1="430" x2="365" y2="470" class="assist-arrow"/>
  <line x1="700" y1="430" x2="700" y2="470" class="assist-arrow"/>
  <line x1="1035" y1="430" x2="1035" y2="470" class="assist-arrow"/>

  <line x1="985" y1="255" x2="985" y2="470" class="assist-arrow"/>
</svg>
